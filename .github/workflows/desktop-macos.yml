name: Build desktop applications

on:
  workflow_dispatch:
  push:
    branches:
      - feature/macos-desktop-package
    tags:
      - 'dsh-desktop-v*'

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: Package ${{ matrix.target }} desktop app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            platform: darwin
            arch: arm64
            runner: macos-14
            makeScript: desktop:make:mac
          - target: darwin-x64
            platform: darwin
            arch: x64
            runner: macos-13
            makeScript: desktop:make:mac
          - target: win32-x64
            platform: win32
            arch: x64
            runner: windows-latest
            makeScript: desktop:make:win
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run desktop unit tests
        run: pnpm --filter @deepseek-ai/dsh-desktop run test

      - name: Package application artifact
        env:
          DSH_DESKTOP_PLATFORM: ${{ matrix.platform }}
          DSH_DESKTOP_ARCH: ${{ matrix.arch }}
        run: pnpm run ${{ matrix.makeScript }}

      - name: Run assembled Electron acceptance test
        run: node node_modules/vitest/vitest.mjs run --config vitest.e2e.config.ts apps/desktop/tests/assembled-transport.e2e.ts

      - name: Materialize delivery artifact
        id: delivery
        env:
          DSH_DESKTOP_PLATFORM: ${{ matrix.platform }}
          DSH_DESKTOP_ARCH: ${{ matrix.arch }}
          DSH_DESKTOP_DELIVERY_DIR: ${{ runner.temp }}/dsh-desktop-delivery-${{ matrix.target }}
        run: pnpm run desktop:materialize:delivery

      - name: Run packaged application smoke
        env:
          DSH_DESKTOP_APPLICATION_PATH: ${{ steps.delivery.outputs.application-path }}
        run: node node_modules/vitest/vitest.mjs run --config vitest.e2e.config.ts apps/desktop/tests/packaged-app-smoke.e2e.ts

      - name: Verify packaged artifacts
        env:
          DSH_DESKTOP_PLATFORM: ${{ matrix.platform }}
          DSH_DESKTOP_ARCH: ${{ matrix.arch }}
        run: pnpm run desktop:verify:artifacts

      - name: Upload macOS artifact
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v7
        with:
          name: dsh-desktop-${{ matrix.target }}-${{ github.run_number }}
          path: |
            apps/desktop/out/DSH-${{ matrix.target }}/DSH.app
            apps/desktop/out/DSH-*-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows artifact
        if: matrix.platform == 'win32'
        uses: actions/upload-artifact@v7
        with:
          name: dsh-desktop-${{ matrix.target }}-${{ github.run_number }}
          path: apps/desktop/out/make/zip/win32/x64/DSH-win32-x64-*.zip
          if-no-files-found: error
          retention-days: 14
