name: Package desktop

# Builds the Desktop application for its three release targets and publishes the installers to
# this repository's own releases, so the Releases page is the download page. A tag carrying the
# packaged version publishes stable; a tag carrying `<version>-beta.<N>` publishes that preview;
# a manual dispatch publishes the next preview.
#
# A preview stamps the whole dsh release family to its beta version before packaging, because
# the packaging chain requires one version across the bundled dsh, the Desktop application, and
# the private Host. The stamp commits inside the runner; the runner publishes artifacts, never
# the commit.
#
# These are fork builds. `DSH_DESKTOP_FORK=1` makes packaging skip Apple signing and
# notarization, the Windows signing token, the update feed, and the mandatory-update policy, so
# the jobs need no signing secrets. An unsigned application updates only by reinstalling:
# macOS Squirrel refuses unsigned updates, and the build ships no feed. Recipients of a macOS
# artifact must clear quarantine once (right-click Open, or `xattr -dr com.apple.quarantine`).
# See apps/desktop/README.md.

on:
  push:
    # The plan job classifies every tag, so the trigger itself stays unfiltered.
    tags: ['*']
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Comma-separated targets to build. Any subset of: mac-arm64, mac-x64, win-x64.
          Empty builds all three.
        type: string
        required: false
        default: ''

concurrency:
  group: desktop-package-${{ github.ref }}
  # Publication owns a release: a cancelled run could publish a partial asset set.
  cancel-in-progress: false

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'
  # Fork-owned application id; the fork switch turns off every official deployment integration
  # that would otherwise require a release environment.
  DSH_DESKTOP_APP_ID: com.agjin.dsh

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      tag: ${{ steps.resolve.outputs.tag }}
      stamp: ${{ steps.resolve.outputs.stamp }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve the packaged version, release channel, and targets
        id: resolve
        env:
          # Passed through the environment, never interpolated into the script text.
          REQUESTED_TARGETS: ${{ inputs.targets }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(jq -r .version apps/desktop/package.json)"
          root="$(jq -r .version package.json)"
          if [ "$base" != "$root" ]; then
            echo "::error::apps/desktop/package.json ($base) and package.json ($root) must carry the same version"
            exit 1
          fi
          stamp=false
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            tag="$GITHUB_REF_NAME"
            case "$tag" in
              "$base")
                channel=stable
                version="$base"
                ;;
              "$base"-beta.*)
                ordinal="${tag#"$base"-beta.}"
                # Digits only: the tag reaches this script through the environment and its
                # suffix becomes a released version.
                case "$ordinal" in
                  ''|*[!0-9]*)
                    echo "::error::preview tag $tag must end in -beta.<number>"
                    exit 1
                    ;;
                esac
                channel=preview
                version="$tag"
                stamp=true
                ;;
              *)
                echo "::error::tag $tag must name either the packaged version $base or a preview $base-beta.<N>; run 'pnpm run release:dsh <version>' before tagging a new version"
                exit 1
                ;;
            esac
          else
            channel=preview
            highest=0
            while read -r ref; do
              [ -n "$ref" ] || continue
              ordinal="${ref##*.}"
              case "$ordinal" in ''|*[!0-9]*) continue ;; esac
              [ "$ordinal" -gt "$highest" ] && highest="$ordinal"
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$base-beta." --jq '.[].ref' 2>/dev/null || true)
            version="$base-beta.$((highest + 1))"
            stamp=true
          fi
          targets="${REQUESTED_TARGETS:-}"
          [ -n "${targets// /}" ] || targets='mac-arm64,mac-x64,win-x64'
          matrix='[]'
          IFS=',' read -r -a requested <<< "$targets"
          for raw in "${requested[@]}"; do
            name="$(echo "$raw" | xargs)"
            [ -z "$name" ] && continue
            # macos-latest is Apple Silicon and macos-15-intel is native x64; each macOS target
            # refuses a host that cannot execute its packaged runtime.
            case "$name" in
              mac-arm64) entry='{"target":"mac-arm64","runner":"macos-latest","env-file":"apps/desktop/.env.macos","command":"pnpm run package:desktop:mac:arm64"}' ;;
              mac-x64) entry='{"target":"mac-x64","runner":"macos-15-intel","env-file":"apps/desktop/.env.macos","command":"pnpm run package:desktop:mac:x64"}' ;;
              win-x64) entry='{"target":"win-x64","runner":"windows-2025","env-file":"apps/desktop/.env.windows","command":"pnpm run package:desktop:win:x64:unsigned"}' ;;
              *)
                echo "::error::Unknown target '$name'. Supported: mac-arm64, mac-x64, win-x64."
                exit 1
                ;;
            esac
            matrix="$(jq -c --argjson entry "$entry" '. + [$entry]' <<< "$matrix")"
          done
          echo "Packaging $channel $version for: $(jq -r '[.[].target] | join(", ")' <<< "$matrix")"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - name: Enable Windows Developer Mode (symlink support)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Windows native modules build through node-gyp, which needs a Python interpreter.
      - uses: actions/setup-python@v6.3.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.10'

      - name: Install (immutable)
        if: runner.os != 'Windows'
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install (immutable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # The packaging chain requires one version across the bundled dsh, the Desktop
      # application, and the private Host, so a preview stamps the whole family.
      - name: Stamp the preview version
        if: needs.plan.outputs.stamp == 'true' && runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm run release:dsh "$RELEASE_VERSION"
          jq -r .version package.json apps/desktop/package.json | sort -u

      - name: Stamp the preview version
        if: needs.plan.outputs.stamp == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm run release:dsh $env:RELEASE_VERSION
          jq -r .version package.json apps/desktop/package.json | Sort-Object -Unique

      # Electron, Node, Python, and wheel archives are content-addressed by the lock files, so
      # a restored cache is always the payload this build would download.
      - uses: actions/cache@v4
        with:
          path: apps/desktop/.desktop-build/downloads
          key: desktop-downloads-${{ matrix.target }}-${{ hashFiles('apps/desktop/scripts/primary-runtime-lock.json') }}

      # Release settings come only from this file, never from the job environment.
      - name: Write the fork release settings
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          printf 'DSH_DESKTOP_APP_ID=%s\nDSH_DESKTOP_FORK=1\n' "$DSH_DESKTOP_APP_ID" > "${{ matrix.env-file }}"
          cat "${{ matrix.env-file }}"

      - name: Write the fork release settings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $settings = "DSH_DESKTOP_APP_ID=$env:DSH_DESKTOP_APP_ID`nDSH_DESKTOP_FORK=1`n"
          Set-Content -Path '${{ matrix.env-file }}' -Value $settings -NoNewline -Encoding utf8
          Get-Content '${{ matrix.env-file }}'

      - name: Package ${{ matrix.target }}
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.command }}

      - name: Package ${{ matrix.target }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.command }}

      - name: Upload ${{ matrix.target }} installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          # Installers only: the unsigned-artifacts directory also holds the unpacked
          # application tree and electron-builder's debug file, which are not release assets.
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.dmg
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.zip
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.zip.blockmap
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.exe.blockmap
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-desktop
          merge-multiple: true

      - name: Publish the preview prerelease
        if: needs.plan.outputs.channel == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist-desktop -maxdepth 2 -type f -print | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no installer artifacts were downloaded"
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
          # Every preview keeps its own beta tag, so an earlier preview stays downloadable.
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$VERSION ($(date -u +%Y-%m-%d))" \
            --notes "Unsigned preview build of DeepSeek Harness Desktop $VERSION from $GITHUB_SHA.

          Installers are unsigned, so macOS requires once: right-click the application and choose Open, or run \`xattr -dr com.apple.quarantine /Applications/DeepSeek\\ Harness.app\`. Windows SmartScreen warns about the unsigned installer."

      - name: Publish the stable release
        if: needs.plan.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist-desktop -maxdepth 2 -type f -print | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no installer artifacts were downloaded"
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --title "DeepSeek Harness Desktop $VERSION" \
            --generate-notes
